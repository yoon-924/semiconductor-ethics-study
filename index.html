에 예방하는 위험 관리의 내부 효과이다", "p": 18}, {"a": "소비자 신뢰 확보", "d": "고객 충성도와 브랜드 가치를 높이는 외부 효과이다", "p": 19}, {"a": "사회적 정당성 확보", "d": "기업 활동에 대한 사회의 지지인 License to Operate를 얻는 외부 효과이다", "p": 19}]}, {"id": "1-2", "title": "반도체 산업의 특성과 윤리적 딜레마", "start": 25, "end": 41, "facts": [{"a": "장치산업", "d": "팹 한 곳에 수십조 원의 투자가 필요하여 속도 압박이 안전 검사 소홀로 이어질 수 있는 산업 특성이다", "p": 27}, {"a": "지식재산권 보호", "d": "핵심 공정·설계의 영업비밀 유출과 경쟁사 기술 탈취를 방지해야 하는 책임이다", "p": 28}, {"a": "글로벌 분업화", "d": "Fabless부터 OSAT까지 세계 공급망이 연결되어 협력사의 윤리 수준도 고려해야 하는 구조이다", "p": 30}, {"a": "공급망 실사", "d": "협력사의 노동인권·안전보건·환경기준 준수 여부를 정기 조사하고 공개하는 활동이다", "p": 26}, {"a": "분쟁 광물", "d": "주석·텅스텐·탄탈륨·금의 채굴 과정에서 아동 노동과 인권 유린이 문제 되는 이슈이다", "p": 31}, {"a": "환경 리스크", "d": "전력·수자원 사용, 유해 화학물질과 폐기물 처리의 투명성에 관한 E 영역이다", "p": 34}, {"a": "사회 리스크", "d": "공급망 인권 실사와 산업재해 예방·보건안전에 관한 S 영역이다", "p": 34}, {"a": "거버넌스 리스크", "d": "국가 핵심기술 유출 방지·지식재산권 보호·부정부패 방지에 관한 G 영역이다", "p": 34}, {"a": "알려지지 않은 위험", "d": "새로운 화학물질과 공정 도입 때문에 건강권 보호와 선제적 안전 조치가 요구되는 위험이다", "p": 33}, {"a": "윤리적 딜레마", "d": "둘 이상의 도덕적으로 정당한 선택지가 충돌하여 어느 선택도 윤리적으로 완전하지 않은 상황이다", "p": 36}, {"a": "개인 대 공동체", "d": "폐수 공장 폐쇄로 인한 직원의 생계권과 지역 주민의 환경·건강권이 충돌하는 구도이다", "p": 37}, {"a": "진실 대 충성", "d": "부당한 행위를 알릴 의무와 회사·동료의 의리를 지킬 의무가 충돌하는 내부고발의 구도이다", "p": 38}, {"a": "단기 대 장기", "d": "환경오염 방지 투자를 미뤄 당장 비용을 줄일지 미래를 위해 투자할지의 갈등 구도이다", "p": 39}]}, {"id": "1-3", "title": "반도체 산업과 윤리경영", "start": 43, "end": 52, "facts": [{"a": "윤리경영", "d": "법적 준수를 넘어 사회적 통념과 도덕적 기대를 경영 전반에 투영한다", "p": 45}, {"a": "지속가능성", "d": "자료의 블랙록 투자 원칙에서 장기적 관점과 함께 고려하는 ESG 관련 기준이다", "p": 44}, {"a": "탄소중립과 에너지윤리", "d": "막대한 전력 소비와 미래 세대 자원을 당겨 쓰는 성장의 책임을 다루는 주제이다", "p": 46}, {"a": "용수 배분 딜레마", "d": "2021년 대만 가뭄에서 전략산업 보호와 지역 주민의 생존권이 충돌한 문제이다", "p": 47}, {"a": "반도체 배분 윤리", "d": "반도체 부족 때 의료기기와 고수익 가전 중 생산 우선순위를 정하는 문제이다", "p": 48}, {"a": "LHR", "d": "자료에서 특정 암호화폐 채굴 효율을 약 50% 수준으로 제한한다고 설명하는 기능이다", "p": 49}, {"a": "거버넌스", "d": "오너 리스크·사외이사회 독립성·주주 환원 정책 등 의사결정 투명성과 관련된다", "p": 50}, {"a": "RBA", "d": "글로벌 공급망의 근로자 존엄성과 권리, 안전한 작업 환경 등을 위한 전자산업계의 자발적 윤리규범이다", "p": 51}, {"a": "RBA의 5개 분야", "d": "노동·안전보건·환경·윤리·관리 시스템으로 구성된다", "p": 51}, {"a": "인간 중심 설계", "d": "자료의 IEEE 관련 네 원칙 중 기술을 인간 중심으로 설계하는 원칙이다", "p": 52}, {"a": "환경적 지속 가능성과 책임", "d": "자료의 IEEE 관련 네 원칙 중 Sustainability에 대응하는 원칙이다", "p": 52}, {"a": "투명성과 책임 있는 소통", "d": "자료의 IEEE 관련 네 원칙 중 Accountability로 제시된 원칙이다", "p": 52}, {"a": "지속적인 윤리적 성찰과 교육", "d": "자료의 IEEE 관련 네 원칙 중 윤리 판단을 계속 돌아보고 배우는 원칙이다", "p": 52}]}, {"id": "2-1", "title": "개인의 윤리적 의사결정 모델", "start": 55, "end": 66, "facts": [{"a": "Bad Apple", "d": "비윤리적 행동의 원인을 개인의 도덕성 결함에서 찾는 관점이다", "p": 57}, {"a": "Bad Barrel", "d": "조직 시스템과 문화가 개인을 비윤리적으로 만들 수 있다고 보는 관점이다", "p": 57}, {"a": "도덕적 지각", "d": "Rest 모델에서 특정 상황에 윤리적 문제가 있음을 인식하는 과정이다", "p": 59}, {"a": "도덕적 판단", "d": "Rest 모델에서 무엇이 옳은 행동인지 결정하고 타당한 대안을 선택하는 과정이다", "p": 59}, {"a": "도덕적 의도", "d": "옳다고 판단한 행동을 하기로 결심하고 승진·이익보다 도덕적 가치를 우선하는 과정이다", "p": 60}, {"a": "도덕적 행동", "d": "도덕적 의도를 실제 실행으로 옮기는 과정이며 용기와 자아 강도가 필요하다", "p": 60}, {"a": "자아 강도", "d": "스트레스와 외부 변화에 유연하게 대처하고 자아를 건강하게 유지하는 심리적 힘이다", "p": 62}, {"a": "내재적 통제 위치", "d": "결과가 자신의 노력과 능력에 달렸다고 보고 스스로 책임지는 성향이다", "p": 62}, {"a": "외재적 통제 위치", "d": "결과를 운과 상황에 돌리고 타인의 지시에 순응하는 성향이다", "p": 62}, {"a": "마키아벨리즘", "d": "냉소적·계산적이고 타인을 조작하며 사익을 위한 속임수에 죄책감을 덜 느끼는 성향이다", "p": 63}, {"a": "도덕적 이탈", "d": "평범한 사람이 죄책감 없이 비윤리적 행동을 하게 만드는 성향이다", "p": 63}, {"a": "조직문화", "d": "구성원이 공유하는 가치관과 신념 체계로 개인 의사결정에 영향을 주는 상황적 요인이다", "p": 64}, {"a": "도덕적 강도", "d": "결과 크기·사회적 합의·효과 확률·시간적 즉시성·근접성·효과 집중도로 구성되는 Jones 모델의 핵심이다", "p": 65}]}, {"id": "2-2", "title": "개인의 도덕 발달 단계", "start": 68, "end": 82, "facts": [{"a": "타율적 도덕성", "d": "Piaget가 4~7세 아동에서 설명한 규칙을 절대적으로 보고 원인보다 결과를 중시하는 단계이다", "p": 71}, {"a": "자율적 도덕성", "d": "Piaget가 8세 이후 아동에서 설명한 의도와 결과를 구분하고 규칙의 상대성을 인식하는 단계이다", "p": 71}, {"a": "인습 이전 수준", "d": "Kohlberg의 처벌 회피와 이익 추구 단계가 속하는 수준이다", "p": 73}, {"a": "인습 수준", "d": "Kohlberg의 사회적 규범과 법과 질서 단계가 속하는 수준이다", "p": 73}, {"a": "인습 이후 수준", "d": "Kohlberg의 사회적 약속과 보편적 윤리 원칙 단계가 속하는 수준이다", "p": 73}, {"a": "1단계 처벌 회피", "d": "감옥에 가지 않기 위해 법을 지킨다는 도덕적 판단 기준이다", "p": 74}, {"a": "2단계 이익 추구", "d": "나에게 이득이 되는지를 판단 기준으로 삼고 타인과의 관계도 교환으로 본다", "p": 75}, {"a": "3단계 사회적 규범", "d": "좋은 직원으로 인정받고 동료의 기대에 부응하려는 판단 기준이다", "p": 76}, {"a": "4단계 법과 질서", "d": "개인적 관계보다 전체 사회의 질서와 예외 없는 법 준수를 중시한다", "p": 77}, {"a": "5단계 사회적 약속", "d": "권리와 공익을 위해 법을 변경할 수 있다고 보는 판단 기준이다", "p": 78}, {"a": "6단계 보편적 윤리 원칙", "d": "자신에게 불이익이 와도 정의·인권·평등의 보편 원칙을 고수한다", "p": 79}, {"a": "정의 윤리", "d": "공정성·권리·규칙·원칙과 논리적 추론에 초점을 둔다", "p": 81}, {"a": "배려 윤리", "d": "관계·책임·조화·상황과 공감·소통·구체적 맥락에 초점을 둔다", "p": 81}]}, {"id": "2-3", "title": "개인의 인지적 편향과 윤리적 판단 오류", "start": 83, "end": 99, "facts": [{"a": "과신 오류", "d": "자신의 윤리 수준을 실제보다 높게 평가하여 자신의 결정을 의심하지 않는 편향이다", "p": 87}, {"a": "이기적 편향", "d": "성공은 자신의 능력·노력으로, 실패는 운·상황으로 해석하는 편향이다", "p": 88}, {"a": "확증 편향", "d": "기존 신념을 지지하는 정보만 받아들이고 반대 증거를 무시하거나 축소한다", "p": 89}, {"a": "프레이밍 효과", "d": "같은 문제라도 표현 방식에 따라 판단이 달라지는 현상이다", "p": 90}, {"a": "손실 회피", "d": "이득의 기쁨보다 손실의 고통을 크게 느껴 확정 손실을 피하려 과도한 위험을 감수할 수 있다", "p": 91}, {"a": "매몰 비용 오류", "d": "회수할 수 없는 과거 지출 때문에 실패가 확실한 프로젝트를 중단하지 못한다", "p": 92}, {"a": "앵커링 효과", "d": "처음 접한 가격·조건·예산 등이 기준점이 되어 이후 판단을 제한한다", "p": 93}, {"a": "집단 사고", "d": "응집력 강한 집단에서 만장일치를 위해 비판적 의견을 억압하고 침묵을 동의로 여긴다", "p": 94}, {"a": "권위에 대한 복종", "d": "권위자 지시에 따라 도덕적 판단을 무시하고 부당한 명령에 순응하는 현상이다", "p": 95}, {"a": "방관자 효과", "d": "주변에 사람이 많을수록 누군가 하겠지 하며 문제 제기나 도움 행동이 줄어드는 현상이다", "p": 96}, {"a": "윤리적 퇴색", "d": "시간과 압박에 따라 윤리적 차원이 시야에서 사라지고 기술·재무 문제로 바뀌는 현상이다", "p": 97}, {"a": "제한된 합리성", "d": "모든 정보를 완벽히 처리하지 못해 휴리스틱을 쓰고 편향이 발생한다는 설명이다", "p": 86}, {"a": "사전 확약", "d": "이해충돌 시 즉시 회피하겠다고 미리 선언하고 내부고발 채널을 숙지하는 교정 방법이다", "p": 98}]}, {"id": "3-1", "title": "윤리적 행동에 영향을 미치는 상황적 요인", "start": 102, "end": 117, "facts": [{"a": "공식적 문화", "d": "윤리강령과 사규처럼 조직이 명문화한 문화이다", "p": 105}, {"a": "비공식적 문화", "d": "실제로 보상받는 행동과 선배의 관행처럼 현장에서 따르는 문화이다", "p": 105}, {"a": "리더십", "d": "직원들이 리더의 말보다 행동을 모방하며 비윤리적 성과 묵인도 영향을 미치는 요인이다", "p": 106}, {"a": "대리인 상태", "d": "자신을 명령의 실행 도구로만 인식하여 책임감을 느끼지 못하는 상태이다", "p": 107}, {"a": "역할과 각본", "d": "주어진 사회적 역할에 몰입해 개인적 양심이 억눌릴 수 있다는 상황 요인이다", "p": 108}, {"a": "보상과 인센티브", "d": "단기 성과만 보상하고 달성 불가능한 목표를 강요하면 숫자 조작을 유도할 수 있는 요인이다", "p": 109}, {"a": "동조 압력", "d": "애쉬 실험처럼 집단 다수의 의견이 개인의 합리적 판단을 왜곡하는 힘이다", "p": 110}, {"a": "자아 고갈", "d": "과도한 업무·스트레스·피로가 누적되어 비윤리적 행동 가능성이 높아지는 상태로 자료가 설명한다", "p": 111}, {"a": "치열한 경쟁", "d": "승리만 유일한 가치가 되고 타인을 제거할 장애물로 인식하여 공감이 저하되는 상황이다", "p": 112}, {"a": "불확실성과 모호함", "d": "명확한 규정이 없을 때 자신에게 유리하게 상황을 해석하고 합리화할 여지가 커지는 요인이다", "p": 113}, {"a": "인지된 불공정성", "d": "부당한 대우를 느껴 복수심·보상심리로 횡령·정보 유출을 정당화할 수 있는 요인이다", "p": 114}, {"a": "심리적 및 물리적 거리", "d": "자신의 추상적 결정이 먼 곳의 피해로 이어지는 인과관계를 체감하기 어려워 죄책감이 줄어드는 요인이다", "p": 115}, {"a": "과정 중심 목표관리", "d": "목표 달성 여부에 더해 달성 과정의 윤리성을 성과 평가에 포함하는 개선 방법이다", "p": 116}]}, {"id": "3-2", "title": "윤리이론: 공리주의의 이해와 적용", "start": 119, "end": 129, "facts": [{"a": "공리주의", "d": "행위 동기보다 결과를 중시하고 사회 전체 효용의 극대화를 도덕적으로 옳다고 본다", "p": 121}, {"a": "벤담", "d": "모든 쾌락은 질적으로 같고 양의 차이만 있다고 보는 양적 공리주의의 인물이다", "p": 121}, {"a": "밀", "d": "지적·도덕적·미적 즐거움 등 쾌락의 질적 차이를 강조한 공리주의의 인물이다", "p": 122}, {"a": "강도", "d": "벤담의 쾌락 계산 기준 중 얼마나 강렬한지를 묻는 기준이다", "p": 121}, {"a": "지속성", "d": "벤담의 쾌락 계산 기준 중 얼마나 오래가는지를 묻는 기준이다", "p": 121}, {"a": "확실성", "d": "벤담의 쾌락 계산 기준 중 얼마나 확실하게 일어나는지를 묻는 기준이다", "p": 121}, {"a": "근접성", "d": "벤담의 쾌락 계산 기준 중 얼마나 즉각적인지를 묻는 기준이다", "p": 121}, {"a": "결과주의", "d": "의도가 선해도 결과가 나쁘면 비윤리적이고 과거 약속보다 미래 변화를 중시하는 입장이다", "p": 123}, {"a": "유용성의 원칙", "d": "행복을 쾌락에서 고통을 뺀 것으로 보고 행복 증진·고통 감소를 선으로 보는 원칙이다", "p": 124}, {"a": "비용-편익 분석", "d": "의사결정의 긍정·부정적 결과를 화폐 가치로 환산하여 비교하는 도구이다", "p": 125}, {"a": "비교 불가능성", "d": "존엄·생명·전통 등 화폐로 환산하기 어려운 가치가 평가절하될 수 있다는 한계이다", "p": 126}, {"a": "행위 공리주의", "d": "매 순간 개별 행동이 최대 행복을 낳는지 결과를 계산하는 입장이다", "p": 128}, {"a": "규칙 공리주의", "d": "일반 규칙을 준수하는 것이 장기적으로 전체에 더 이익인지 판단하는 입장이다", "p": 128}]}, {"id": "3-3", "title": "윤리이론: 의무론과 덕 윤리", "start": 131, "end": 141, "facts": [{"a": "의무론", "d": "결과보다 행위의 동기와 도덕 규칙 준수를 중시하는 윤리이론이다", "p": 133}, {"a": "칸트", "d": "인간을 이성으로 스스로 도덕법칙을 만들고 따르는 자율적 존재로 본 철학자이다", "p": 133}, {"a": "선 의지", "d": "보상이나 평판 때문이 아니라 옳기 때문에 도덕법칙을 따르는 의지이다", "p": 134}, {"a": "정언 명령", "d": "조건 없는 절대적 도덕 명령이다", "p": 134}, {"a": "가언 명령", "d": "어떤 목적을 달성하려면 특정 행동을 하라는 조건부 명령이다", "p": 134}, {"a": "보편화 가능성", "d": "내 행위의 규칙이 모든 사람에게 적용되는 도덕법칙이 될 수 있는지를 묻는 정식이다", "p": 135}, {"a": "인간 존엄성", "d": "타인을 단순한 수단으로만 대하지 않고 동시에 목적으로 존중해야 한다는 정식이다", "p": 135}, {"a": "의무 충돌", "d": "거짓말 금지와 무고한 사람 보호 같은 규칙이 부딪칠 때 해결이 어렵다는 의무론의 한계이다", "p": 136}, {"a": "덕 윤리", "d": "행위의 결과·규칙보다 행위자의 인격과 평생에 걸친 훌륭한 성품 형성에 초점을 둔다", "p": 137}, {"a": "아리스토텔레스", "d": "행복을 단순 쾌락보다 인간의 잠재력을 발휘한 번영으로 설명한 덕 윤리의 철학자이다", "p": 137}, {"a": "기능 논변", "d": "각자의 고유 기능을 잘 실현할 때 최선의 상태에 이른다는 주장이다", "p": 138}, {"a": "중용", "d": "과잉과 결핍 사이에서 때·대상·동기·태도에 맞게 행동하는 최적 상태로 산술적 중간이 아니다", "p": 138}, {"a": "성품과 습관", "d": "Hexis와 관련되며 반복된 습관을 도덕성의 근원으로 보는 덕 윤리의 개념이다", "p": 138}]}, {"id": "4-1", "title": "윤리적 리더십의 중요성", "start": 144, "end": 157, "facts": [{"a": "윤리적 리더십", "d": "적절한 행동의 모범을 보이고 양방향 소통·강화·의사결정으로 구성원의 윤리 행동을 촉진한다", "p": 147}, {"a": "도덕적 인간", "d": "리더 개인의 정직성·신뢰성·청렴함과 원칙에 따른 의사결정이라는 기둥이다", "p": 148}, {"a": "도덕적 관리자", "d": "역할 모델링·윤리 소통·보상과 처벌로 윤리를 조직의 어젠다로 만드는 기둥이다", "p": 148}, {"a": "윤리적 리더", "d": "도덕적 인간과 도덕적 관리자를 함께 갖춘 유형이다", "p": 149}, {"a": "위선적 리더", "d": "윤리를 말하지만 뒤에서는 수단을 가리지 말고 수익을 내라고 압박하는 유형이다", "p": 150}, {"a": "윤리적 침묵 리더", "d": "개인은 착하지만 윤리를 굳이 말하지 않아 구성원에게 방향을 주지 못하는 유형이다", "p": 150}, {"a": "비윤리적 리더", "d": "스스로 비윤리적으로 행동하며 그런 행동을 조장하는 유형이다", "p": 149}, {"a": "사회학습이론", "d": "타인의 행동과 그 결과를 관찰하고 리더를 역할 모델로 삼아 학습한다는 설명이다", "p": 151}, {"a": "낙수 효과", "d": "최고경영진의 윤리 가치관이 중간관리자를 거쳐 말단 직원에게 전파되는 효과이다", "p": 151}, {"a": "서번트 리더십", "d": "구성원을 섬기며 성장·발전을 우선하고 공감·경청·치유를 강조한다", "p": 153}, {"a": "진성 리더십", "d": "자아인식·내재적 도덕관점·관계적 투명성에 기반한 리더십이다", "p": 153}, {"a": "동기화된 눈멀음", "d": "자신에게 이익이 될 때 타인의 비윤리적 행동을 못 본 척하는 사각지대이다", "p": 154}, {"a": "간접적 눈멀음", "d": "대리인이나 하청업체를 통해 비윤리적 일을 시키고 책임을 회피하는 사각지대이다", "p": 154}]}, {"id": "4-2", "title": "윤리적 기업문화의 구축과 유지", "start": 159, "end": 175, "facts": [{"a": "기업문화", "d": "구성원이 공유하는 가치관·신념·행동 규범의 집합체이다", "p": 162}, {"a": "인공물", "d": "Schein 모델에서 사무실 배치·복장·의례·언어 등 겉으로 드러나는 차원이다", "p": 162}, {"a": "표방하는 가치", "d": "Schein 모델에서 기업이 공식적으로 내세우는 전략·목표·철학이다", "p": 162}, {"a": "기본 가정", "d": "Schein 모델에서 무의식적으로 당연하게 여겨 사고와 감정을 지배하는 가장 깊은 믿음이다", "p": 162}, {"a": "정체성 부여", "d": "기업문화가 우리는 누구인가에 답하고 자부심·소속감을 형성하는 기능이다", "p": 164}, {"a": "사회적 접착제", "d": "기업문화가 구성원을 묶고 갈등을 줄여 협력을 촉진하는 기능이다", "p": 164}, {"a": "강한 문화", "d": "핵심 가치가 널리 공유되고 내재화되어 행동 일관성이 높으나 집단사고 위험도 있는 문화이다", "p": 165}, {"a": "약한 문화", "d": "공유 가치가 약하여 통합된 힘이 부족하고 관료적 규칙과 규제에 의존하는 문화이다", "p": 165}, {"a": "공식적 시스템", "d": "선발·윤리강령·교육훈련·성과관리·권한구조·의사결정 프로세스를 포함한다", "p": 167}, {"a": "비공식적 시스템", "d": "역할 모델과 영웅·규범·의식·신화와 이야기·언어를 포함한다", "p": 168}, {"a": "정렬", "d": "공식적 제도와 비공식적 관행이 함께 윤리적 행동을 지원하도록 맞추는 것이다", "p": 166}, {"a": "공정한 징계", "d": "비윤리적 행위를 지위고하에 관계없이 예외 없이 처리하는 문화 유지 전략이다", "p": 172}, {"a": "제보자 보호", "d": "익명 제보 접근성에 더해 보복 방지·비밀 유지·처리 결과 피드백으로 신뢰를 높이는 전략이다", "p": 173}]}, {"id": "4-3", "title": "윤리적 분위기의 유형과 특징", "start": 177, "end": 194, "facts": [{"a": "윤리적 분위기", "d": "무엇이 옳은 행동이며 윤리 문제를 어떻게 해결하는지에 관한 조직의 공유된 인식이다", "p": 180}, {"a": "기업문화", "d": "뿌리 깊은 가치관·신념·가정으로 장기 형성되며 분위기보다 변경하기 어려운 포괄적 개념이다", "p": 181}, {"a": "이기주의 기준", "d": "나의 이익이나 결과가 가져올 이익 극대화를 우선하는 기준이다", "p": 183}, {"a": "공리주의 기준", "d": "자료의 분위기 분석에서 Benevolence로 표기되며 타인·집단의 행복과 복지를 우선한다", "p": 183}, {"a": "원칙주의 기준", "d": "결과와 무관하게 법·규칙·도덕적 의무 준수를 우선하는 기준이다", "p": 183}, {"a": "개인 수준", "d": "개인의 신념이나 이익을 윤리 판단 기준으로 삼는 분석 범위이다", "p": 184}, {"a": "지역 수준", "d": "우리 팀·회사 이익과 동료 관계·사내 규정을 중시하는 분석 범위이다", "p": 184}, {"a": "광역 수준", "d": "법률·전문가 윤리강령·사회 전체 복지를 중시하는 분석 범위이다", "p": 184}, {"a": "수단형", "d": "이기주의와 개인·지역 수준의 조합으로 이익을 최우선시하여 비윤리적 행동 위험이 높은 분위기이다", "p": 185}, {"a": "배려형", "d": "구성원과 고객의 안녕을 우선하며 직무 만족도와 강한 양의 상관관계를 갖는 분위기이다", "p": 186}, {"a": "독립형", "d": "원칙주의와 개인 수준의 조합으로 개인의 양심과 도덕적 신념에 따른 행동을 장려한다", "p": 187}, {"a": "규칙형", "d": "원칙주의와 지역 수준의 조합으로 회사 사규·절차·매뉴얼 준수를 중시한다", "p": 188}, {"a": "법규형", "d": "원칙주의와 광역 수준의 조합으로 국가 법률·전문직 윤리강령을 우선한다", "p": 189}]}, {"id": "5-1", "title": "효과적인 윤리 프로그램의 구성 요소", "start": 197, "end": 211, "facts": [{"a": "FSGO", "d": "자료에 따르면 1991년 미국에서 제정되었고 효과적 윤리 프로그램 운영을 양형에 고려하는 지침이다", "p": 201}, {"a": "윤리 강령", "d": "기업이 추구하는 근본 가치의 추상적 선언인 Code of Ethics이다", "p": 202}, {"a": "행동 강령", "d": "가치를 일상 업무에서 실천하는 구체적 규칙인 Code of Conduct이다", "p": 202}, {"a": "윤리 교육", "d": "규정 암기 이상으로 비윤리적 압력에 저항하고 딜레마를 해결할 판단력·용기를 기르는 활동이다", "p": 204}, {"a": "헬프라인", "d": "윤리 딜레마 상담 기능과 비윤리적 행위 보고 기능을 함께 제공하는 공식 채널이다", "p": 205}, {"a": "익명성", "d": "신원을 밝히지 않고도 보고할 수 있게 하는 헬프라인 운영 원칙이다", "p": 205}, {"a": "독립성", "d": "관련 부서·경영진 개입 없이 제보를 조사하는 헬프라인 운영 원칙이다", "p": 205}, {"a": "신속성", "d": "제보 조사 착수와 결과 통보 기한을 정해 지키는 운영 원칙이다", "p": 205}, {"a": "윤리 담당 임원", "d": "프로그램을 설계·운영·점검하고 CEO나 이사회에 직접 보고하는 고위 책임자이다", "p": 206}, {"a": "무관용 원칙", "d": "고위 경영진·고성과자도 위반 시 예외를 두지 않아 프로그램 신뢰를 지키는 원칙이다", "p": 207}, {"a": "근본 원인 분석", "d": "사건이 개인 일탈인지 시스템 결함인지 파악하여 재발 방지로 연결하는 분석이다", "p": 208}, {"a": "Tone at the Top", "d": "CEO와 이사회가 윤리를 최우선 가치로 말과 행동에 보여주는 의지이다", "p": 209}, {"a": "윤리적 코치", "d": "중간관리자가 구성원의 딜레마 해결을 돕는 상담가 역할이다", "p": 209}]}, {"id": "5-2", "title": "컴플라이언스와 내부통제시스템", "start": 213, "end": 226, "facts": [{"a": "컴플라이언스", "d": "자료의 넓은 정의에서 법규·규칙·사규를 자발적으로 준수하고 위반 리스크를 사전에 통제하는 모든 활동이다", "p": 216}, {"a": "준법 감시인", "d": "법규 준수 여부를 감시하고 위반 시 이사회에 보고하는 독립적 책임자이다", "p": 218}, {"a": "COSO 프레임워크", "d": "경영 리스크 관리와 재무보고 신뢰성 확보를 위해 내부통제의 통합 구조를 제시한다", "p": 219}, {"a": "내부 환경", "d": "자료의 COSO 8요소 중 조직문화·경영진 철학·윤리 등 조직 내부 바탕이다", "p": 220}, {"a": "목표 설정", "d": "자료의 COSO 8요소 중 전략 목표와 내부통제 목적을 명확히 하는 요소이다", "p": 220}, {"a": "사건 식별", "d": "자료의 COSO 8요소 중 리스크·이상 징후를 조기에 파악하는 요소이다", "p": 220}, {"a": "리스크 평가", "d": "식별한 리스크의 발생 가능성과 영향을 평가하는 요소이다", "p": 220}, {"a": "리스크 대응", "d": "평가 결과에 따라 리스크 통제·완화 방안을 마련하는 요소이다", "p": 220}, {"a": "통제 활동", "d": "실제 통제 절차와 실행 방안을 구체화하는 요소이다", "p": 220}, {"a": "정보 및 의사소통", "d": "관련 정보의 수집·전달과 소통 체계를 구축하는 요소이다", "p": 220}, {"a": "모니터링", "d": "통제 활동의 효과성과 적절성을 지속적으로 점검하는 요소이다", "p": 220}, {"a": "제1선 현업 부서", "d": "영업·생산 등 실제 업무에서 리스크를 일차 식별하고 관리하는 방어선이다", "p": 221}, {"a": "제3선 내부 감사", "d": "제1·2선 작동을 독립적으로 평가하고 이사회에 보고하는 방어선이다", "p": 221}]}, {"id": "5-3", "title": "내부종업원들의 윤리문제", "start": 228, "end": 240, "facts": [{"a": "심리적 계약", "d": "문서화한 근로계약 외에 고용주와 종업원 간 상호 기대·의무에 관한 암묵적 믿음이다", "p": 231}, {"a": "다중 윤리 자아", "d": "단일한 윤리 기준보다 자신이 처한 역할과 맥락에 따라 다른 기준을 적용하는 현상이다", "p": 232}, {"a": "심리적 구획화", "d": "삶을 서로 연결되지 않은 방으로 나누고 방마다 다른 규칙을 적용하는 현상이다", "p": 232}, {"a": "차별", "d": "업무 능력과 무관한 요소로 채용·승진·보상에서 불리하게 대우하는 행위이다", "p": 233}, {"a": "직장 내 성희롱", "d": "단순한 성적 요구를 넘어 권력관계에서 발생하는 인권 침해이다", "p": 233}, {"a": "직장 내 괴롭힘", "d": "지위·관계의 우위를 이용해 업무상 적정 범위를 넘어 고통을 주거나 근무환경을 악화시킨다", "p": 233}, {"a": "이해상충", "d": "직무상 회사의 이익과 개인의 사익이 충돌하는 상황이다", "p": 234}, {"a": "압력", "d": "과도한 성과 목표·개인 재정 문제·상사의 부당한 지시처럼 부정을 밀어붙이는 요인이다", "p": 235}, {"a": "기회", "d": "허술한 내부통제·감시 부재·재량권 남용처럼 부정을 가능하게 하는 요인이다", "p": 235}, {"a": "합리화", "d": "자기 중심적 정당화를 통해 비윤리적 행동을 받아들이는 원인이다", "p": 235}, {"a": "분배적 공정성", "d": "급여·승진 등 보상의 결과가 공정한지를 묻는다", "p": 236}, {"a": "절차적 공정성", "d": "결과를 도출하는 절차가 투명하고 일관적인지를 묻는다", "p": 236}, {"a": "상호작용 공정성", "d": "존중과 예의를 갖춰 대우하는지를 묻는다", "p": 236}]}, {"id": "6-1", "title": "윤리적 인간: 다중 자아와 채용 관리", "start": 243, "end": 255, "facts": [{"a": "다중 윤리 자아", "d": "가정·친구·직장 등 맥락마다 서로 다른 역할과 윤리 기준을 적용한다는 개념이다", "p": 245}, {"a": "언어적 완곡어법", "d": "조작을 조정으로, 불법을 관행으로 불러 위반을 정당화할 수 있는 조직 언어이다", "p": 247}, {"a": "인지 부조화", "d": "도덕적 신념과 실제 행동이 일치하지 않을 때 느끼는 심리적 고통이다", "p": 248}, {"a": "자기합리화", "d": "회사를 위한 일·이번 한 번·나만 그러는 게 아니라는 말로 신념과 행동의 불일치를 덮는 반응이다", "p": 248}, {"a": "가치관 정렬", "d": "개인 가치와 조직 가치를 맞추고 핵심 가치를 실제 업무 언어로 지속 노출하는 관리이다", "p": 249}, {"a": "정직성 검사", "d": "비윤리적 행동에 대한 수용도와 과거 경험을 측정하는 필터링 도구이다", "p": 251}, {"a": "사회적 바람직성 편향", "d": "정직성 검사에서 좋게 보이려고 답을 꾸며내는 편향이다", "p": 251}, {"a": "심층 배경 검증", "d": "경력·학력과 경업금지 위반·법적 분쟁 이력 등을 확인하는 기법이다", "p": 251}, {"a": "행동 기반 면접", "d": "과거의 구체적 윤리 갈등 상황을 물어 판단력과 도덕성을 평가하는 기법이다", "p": 251}, {"a": "BEI", "d": "가상 상황보다 실제 겪었던 윤리 갈등과 본인의 역할·행동·결과·배운 점을 심층 질문하는 면접이다", "p": 252}, {"a": "STAR", "d": "Situation·Task·Action·Result로 과거 갈등 상황과 행동 및 결과를 구조화한다", "p": 253}, {"a": "평판 조회", "d": "이전 직장·학교에서의 협업·갈등 해결·보안 준수 등 반복적 행동 패턴을 주변을 통해 확인한다", "p": 254}, {"a": "윤리적 온보딩", "d": "입사 초기 상사·선배의 행동과 첫 교육으로 윤리적 마지노선을 명확히 전달한다", "p": 255}]}, {"id": "6-2", "title": "보상과 징계: 행동을 결정하는 조직 설계", "start": 257, "end": 270, "facts": [{"a": "조작적 조건화", "d": "스키너가 제시했으며 행동 결과의 강화·처벌에 따라 행동 빈도가 결정된다는 원리이다", "p": 259}, {"a": "터널 시야", "d": "원가 절감 등 특정 목표에만 집중하여 환경 보호 같은 주변 윤리 가치를 보지 못하는 현상이다", "p": 260}, {"a": "품질 윤리의 KPI 반영", "d": "수율·납기만 강조할 때 생기는 결함 통과 유혹을 줄이기 위해 안전과 품질을 평가에 필수 배점화한다", "p": 261}, {"a": "피그말리온 효과", "d": "관리자의 긍정적 기대와 신뢰가 직원의 능력 향상·행동 변화로 이어지는 효과이다", "p": 262}, {"a": "사전 경고", "d": "뜨거운 난로 법칙 중 규칙과 위반 시 징계를 미리 명확히 알리는 원칙이다", "p": 263}, {"a": "즉각성", "d": "뜨거운 난로 법칙 중 위반 후 지체 없이 징계하여 행동과 결과 연결을 유지하는 원칙이다", "p": 263}, {"a": "일관성", "d": "뜨거운 난로 법칙 중 같은 위반에 대해 누구든 항상 같은 징계를 적용하는 원칙이다", "p": 263}, {"a": "비인격성", "d": "뜨거운 난로 법칙 중 친소 관계나 감정 대신 잘못된 행동 자체를 공정하게 다루는 원칙이다", "p": 263}, {"a": "과정 평가", "d": "얼마나 성과를 냈는가와 함께 어떻게 달성했는가를 평가하는 관점이다", "p": 266}, {"a": "비금전적 보상", "d": "윤리 챔피언 포상과 전문가적 자긍심처럼 인정과 내재적 동기를 활용하는 보상이다", "p": 267}, {"a": "나쁜 수익", "d": "고객 기만·안전 희생으로 얻어 성과급에서 제외하거나 페널티를 줄 수 있는 수익이다", "p": 268}, {"a": "넛지", "d": "선택의 자유를 제한하거나 경제적 인센티브를 크게 바꾸지 않고 행동을 부드럽게 유도한다", "p": 269}, {"a": "보상·징계의 투명성", "d": "개인정보를 제외한 기준과 결과를 공유하여 특혜 오해를 줄이고 시스템 신뢰를 형성한다", "p": 270}]}, {"id": "6-3", "title": "조직의 압력과 개인의 책임", "start": 272, "end": 285, "facts": [{"a": "집단 규범", "d": "구성원 사이에 공유되는 명시적·비명시적 행동 기준으로 현장 관행이 강령보다 우선할 위험이 있다", "p": 274}, {"a": "동조", "d": "집단에서 소외될 압력 때문에 명백한 다수의 오답에 개인이 따르는 현상이다", "p": 275}, {"a": "사회적 역할", "d": "스탠퍼드 감옥 실험 사례에서 주어진 간수·죄수 역할이 행동에 미치는 영향을 설명한다", "p": 276}, {"a": "관리자의 관점", "d": "반도체 라인에서 수율·납기·가동률 등 비즈니스 성과지표 중심으로 현상을 본다", "p": 277}, {"a": "엔지니어의 관점", "d": "반도체 라인에서 정밀도·데이터 정직성·공정 안전성을 중심으로 현상을 본다", "p": 277}, {"a": "대리인 상태", "d": "밀그램 실험과 관련되며 자신이 결정한 것이 아니라 시키는 대로 했다는 책임 회피 상태이다", "p": 278}, {"a": "데이터 중심 수평 토론", "d": "상급자의 권위 때문에 기술적 양심을 접지 않도록 직급 대신 근거로 판단하는 대응이다", "p": 279}, {"a": "책임의 분산", "d": "볼 사람이 많으니 누군가 행동하겠지 하며 자신의 책임을 느끼지 못하는 현상이다", "p": 280}, {"a": "관료적 소외", "d": "파편화된 공정에서 자신을 기계 부품으로 느껴 최종 고객 피해와 도덕적 책임을 체감하지 못한다", "p": 282}, {"a": "윤리적 오너십", "d": "모든 구성원이 담당 공정의 최종 수문장이라는 책임을 갖는 태도이다", "p": 283}, {"a": "Andon 시스템", "d": "누구든 결함을 발견하면 신호를 보내 생산 라인을 멈출 권한과 책임을 갖는 철학이다", "p": 283}, {"a": "심리적 안전감", "d": "비판·실수 고백·의문을 제기해도 보복당하거나 무시당하지 않는다는 확신이다", "p": 284}, {"a": "상호 의존성", "d": "아리스토텔레스 프로젝트에서 팀원이 각자 역할을 신뢰하고 기한 안에 높은 수준의 결과를 낸다는 확신이다", "p": 285}]}, {"id": "7-1", "title": "반도체 산업의 안전과 보건 윤리", "start": 288, "end": 302, "facts": [{"a": "화학적 위험", "d": "감광액·유기용제 등 발암성·생식독성 물질의 피부 흡수·호흡기 노출 위험이다", "p": 291}, {"a": "물리적 위험", "d": "이온 주입 공정의 엑스선 같은 전리방사선과 초고압 설비의 전기적 위험이다", "p": 291}, {"a": "가스 위험", "d": "실란 같은 자가발화성 가스와 맹독성 가스 누출 위험이다", "p": 291}, {"a": "MSDS", "d": "성분·유해성·응급조치·보호구 등 화학물질 안전 정보를 담은 물질안전보건자료이다", "p": 292}, {"a": "ISO 45001", "d": "전 구성원 참여와 PDCA 반복 개선을 강조하는 안전보건 경영시스템 국제 표준이다", "p": 293}, {"a": "LOTO", "d": "설비 수리 중 전원·가스가 공급되지 않도록 잠금장치와 표지판을 부착하는 절차이다", "p": 295}, {"a": "작업 중지권", "d": "신입·협력사 직원도 불안전한 상태를 발견하면 즉시 작업을 멈추게 할 수 있는 권리이다", "p": 296}, {"a": "PSM", "d": "유해·위험 설비의 누출·화재·폭발 등 중대 사고 예방을 위한 종합적 공정안전관리 체계이다", "p": 297}, {"a": "변경 요소 관리", "d": "작은 부품이나 가스 종류를 바꿀 때도 사전 안전성 평가를 요구하는 MOC이다", "p": 297}, {"a": "위험의 외주화", "d": "위험 작업을 협력사에 맡겨 자사 사고 통계를 깨끗하게 하려는 책임 회피 문제이다", "p": 300}, {"a": "의존적 안전 단계", "d": "관리자 지시나 벌금이 무서워 안전 수칙을 지키는 Bradley Curve 단계이다", "p": 302}, {"a": "독립적 안전 단계", "d": "스스로의 안전을 위해 자율적으로 수칙을 지키는 Bradley Curve 단계이다", "p": 302}, {"a": "상호의존적 안전 단계", "d": "자신뿐 아니라 동료의 안전까지 챙기는 조직문화가 형성된 Bradley Curve 단계이다", "p": 302}]}, {"id": "7-2", "title": "디지털 감시와 프라이버시 보호", "start": 304, "end": 317, "facts": [{"a": "MDM", "d": "스마트폰 카메라·위치 등 기능을 원격 제어하여 보안 정책을 적용하는 모바일 기기 관리이다", "p": 305}, {"a": "프라이버시", "d": "자신의 정보가 언제·어떻게·어느 정도 전달될지 스스로 결정할 권리이다", "p": 307}, {"a": : "자료는 클린룸도 실제로 안전하지 않을 수 있다는 경각심을 강조한다.", "page": 289, "label": "함정 OX·제작", "status": "[추론] 원문 경고·한계의 변형", "priority": false}, {"id": "OX30", "ch": "7-1", "type": "ox", "q": "협력사 신입 직원은 위험을 발견해도 작업 중지를 요청할 수 없다.", "options": ["O", "X"], "answer": 1, "explain": "신입·협력사 직원도 작업 중지권을 행사할 수 있다.", "page": 296, "label": "함정 OX·제작", "status": "[추론] 원문 경고·한계의 변형", "priority": false}, {"id": "OX31", "ch": "7-1", "type": "ox", "q": "이미 검증된 공정이라면 작은 부품 교체는 안전성 평가를 사후에 해도 된다.", "options": ["O", "X"], "answer": 1, "explain": "MOC는 작은 변경에도 사전 안전성 평가를 요구한다.", "page": 297, "label": "함정 OX·제작", "status": "[추론] 원문 경고·한계의 변형", "priority": false}, {"id": "OX32", "ch": "7-1", "type": "ox", "q": "같은 사업장의 협력사 직원도 소속에 관계없이 동등한 안전 보호를 받아야 한다.", "options": ["O", "X"], "answer": 0, "explain": "위험 외주화와 보호 불평등을 지적한다.", "page": 300, "label": "함정 OX·제작", "status": "[추론] 원문 경고·한계의 변형", "priority": false}, {"id": "OX33", "ch": "7-2", "type": "ox", "q": "카메라 차단만으로 충분해도 직원 위치 정보를 함께 수집하는 것이 최소 침해다.", "options": ["O", "X"], "answer": 1, "explain": "필요를 넘어선 위치 수집은 자료의 과잉 감시 예시다.", "page": 308, "label": "함정 OX·제작", "status": "[추론] 원문 경고·한계의 변형", "priority": false}, {"id": "OX34", "ch": "7-2", "type": "ox", "q": "AI가 부정을 탐지하면 인간의 소명 절차 없이 즉시 최종 징계할 수 있다.", "options": ["O", "X"], "answer": 1, "explain": "거짓 양성이 가능하므로 반드시 인간의 재검토와 소명이 필요하다.", "page": 312, "label": "함정 OX·제작", "status": "[추론] 원문 경고·한계의 변형", "priority": false}, {"id": "OX35", "ch": "7-2", "type": "ox", "q": "직접 작성한 회사 파일은 퇴사 때 사생활 보호를 이유로 무단 반출해도 된다.", "options": ["O", "X"], "answer": 1, "explain": "자료는 회사 비용·장비·시간으로 만든 결과물을 기업 소유로 설명한다.", "page": 313, "label": "함정 OX·제작", "status": "[추론] 원문 경고·한계의 변형", "priority": false}, {"id": "OX36", "ch": "7-3", "type": "ox", "q": "제보자를 보호하려면 피고발자는 조사 전부터 범죄자로 취급해야 한다.", "options": ["O", "X"], "answer": 1, "explain": "객관적 조사·무죄 추정·방어권도 보장해야 한다.", "page": 328, "label": "함정 OX·제작", "status": "[추론] 원문 경고·한계의 변형", "priority": false}, {"id": "OX37", "ch": "7-3", "type": "ox", "q": "고발자에게 보복한 사람도 지위고하를 막론하고 엄중히 처벌해야 한다.", "options": ["O", "X"], "answer": 0, "explain": "보복 금지의 무관용 원칙으로 제도의 실효성을 확보한다.", "page": 327, "label": "함정 OX·제작", "status": "[추론] 원문 경고·한계의 변형", "priority": false}], "schedule": [["10/20(화) 첫날 밤 시작", "20", "사전 테스트 21문항(챕터별 1개). 요약을 먼저 열지 않고 답→확신도→피드백.", "모르는 개념을 드러내는 사전 테스트. 50초 이상 막히면 찍음으로 기록."], ["첫날 밤 이어서", "35", "요약 카드 1~3대단원 9개를 한 번 정독. 비교표를 읽고 가린 뒤 단계·차이를 말한다.", "재독 시간을 제한하고 Rest·Kohlberg·3이론·편향의 구분 틀 형성."], ["첫날 밤 이어서", "25", "요약 카드 4~5대단원 6개 정독. 자료 Quiz가 붙은 개념을 확인.", "리더·문화·분위기·FSGO·내부통제 용어를 서로 구분."], ["첫날 밤 이어서", "20", "요약 카드 6~7대단원 6개 정독. 안전·감시·고발의 절차와 조건을 말한다.", "첫날에 전 범위 노출을 마쳐 마지막 날 새 내용 금지 조건 충족."], ["첫날 밤 마지막 학습 구간", "10", "우선 108 모드로 챕터 혼합 객관식. 시간이 끝나면 현재 문제까지만.", "같은 단원 몰아풀기를 피하고 문항별 확신도를 보정."], ["첫날 실제 취침 직전", "10", "오답 노트의 확신 오답→애매 오답→찍음 순서. 해설을 가리고 용어를 재인출.", "정답 확인 뒤 다시 가리고 말하기. 잠들기 전 학습-수면 연결."], ["10/21(수) 첫 출근 세션", "15", "이전 세션 오답 재인출. 복습 예정 모드로 기한이 지난 문항부터.", "수면 뒤 재학습; 3시간 복습이 수면 중이면 기상 후 처리."], ["10/21 퇴근 이동", "15", "우선 108 모드. 편향·도덕단계·분위기를 섞어 구분.", "유사 개념을 다른 상황에서 구별하는 인출 연습."], ["10/21 점심", "20", "기출·자료 Quiz 24문항 중 미완료를 풀이. 남으면 우선 문항.", "자료가 직접 묻는 용어와 객관식 오답 구분에 우선 배점."], ["10/21 밤 본학습", "50", "우선 108 남은 문항(최대 35분)→오답 재출제·OX(15분). 첫 노출은 첫날까지.", "세션당 정답 확인 뒤 해설을 가리고 다시 인출. 미완료는 마지막 날 새로 열지 않는다."], ["10/21 실제 취침 직전", "10", "확신 오답을 먼저, 첫날 틀린 용어·절차를 답 없이 재인출.", "수면 전 오답 교정과 다음 날 재학습 연결."], ["10/22(목) 첫 출근 세션", "15", "이전 세션 오답만 재인출. 새 문제 모드 금지.", "수면 뒤 회복된 기억 점검."], ["10/22 퇴근 이동", "15", "모의고사 42문항 시작, 약 10문항 후 중단·이어풀기.", "이미 답한 은행 문항에서만 챕터 균형 표집, 즉시 해설 없이 시험처럼."], ["10/22 점심", "20", "같은 모의고사 이어풀기, 약 14문항.", "서로 다른 챕터의 객관식을 섞어 시간 안에 독립 인출."], ["10/22 밤", "35", "같은 모의고사 완주·제출. 남는 시간은 모의 오답만.", "남은 약 18문항 및 제출. 학습 기록이 부족하면 42개 이하로 출제하며 새 문항을 보충하지 않는다."], ["10/22 밤 이어서", "15", "모의고사 오답 해설 확인→가리고 재답. 확신 오답 최우선.", "시험 전 취약점을 교정하되 새 내용 추가 금지."], ["10/22 실제 취침 직전", "10", "마지막 확신 오답·핵심 용어만 재인출.", "수면을 줄이지 않고 이미 학습한 내용 마무리."]], "supplements": {"1-1": "3대 요소=준법경영·사회적 책임·가치경영. 법은 Must Do, 윤리는 Should Do. p.8 평가비중=지필 70%, 과제·포트폴리오 15%, 출석·참여 15%. p.21 성능데이터 오류 보고 사례는 출시 최소 3개월 지연과 고객 안전의 갈등이다.", "1-2": "5대 산업 특성=장치산업·초미세공정/IP·글로벌 분업·환경 영향·기술 불확실성과 안전. p.31 3TG=주석·텅스텐·탄탈륨·금. p.35 윤리지수는 5개 항목·240개 이상 세부 문항으로 설명됨. 이 수치는 자료 기준이다.", "1-3": "p.49 LHR 채굴 효율 약 50%는 해당 사례의 설명이다. p.51 RBA의 5개 분야와 p.52 IEEE 관련 4개 원칙은 서로 다른 목록이다. 기술 성능 외에도 배분·지역사회·거버넌스·공급망을 함께 판단한다.", "2-1": "Rest=지각→판단→의도→행동(4요소). p.61 독립적으로 작용하며 일반적으로 순차적이지만 예외가 있다. p.63 도덕적 이탈 예=도덕적 정당화·책임 전가·비인간화. p.65 Jones=결과 크기·사회적 합의·효과 확률·시간적 즉시성·근접성·효과 집중도(6요소).", "2-2": "3수준×2단계=6단계. 단계 판별은 선택의 찬반만이 아니라 판단 이유를 본다[추론: 각 단계의 서로 다른 하인츠 반응에 근거]. p.72 약 제조 200달러·청구 2000달러·모은 돈 1000달러. p.80 한계=성차별적 편향·문화적 편향·순차 발달의 한계. 성별 차이는 자료가 소개한 이론 비판의 맥락이다.", "2-3": "p.85 규범윤리=어떻게 행동해야 하는가, 행동윤리=실제로 왜 그렇게 행동하는가. 프레이밍은 표현에 따른 판단 변화, 윤리적 퇴색은 윤리 차원 소실. 방관자 효과의 기제=책임 분산·다원적 무지(p.96). 교정=인지·교육, 윤리 넛지, 사전 확약(p.98).", "3-1": "상황 요인 11개=문화·리더십·권위/복종·역할/각본·보상·동조·시간압박/인지부하·경쟁·모호함·불공정성·거리(p.105~115). 개선 5개=시스템 설계·심리적 안정감·과정 평가·윤리 리더십·성찰 시간(p.116).", "3-2": "행복=쾌락−고통(p.124). 비용보다 편익이 크면 추진이라는 도구 논리(p.125)를 생명·인권 판단의 충분조건으로 외우지 않는다. 한계=비교 불가능성·결과 불확실성·분배 취약성(p.126). 적합=측정 가능한 자원 배분; 부적합=회복 불가능한 소수 피해·인권·안전 등(p.127).", "3-3": "3이론 비교(p.140): 공리주의=결과/최대 행복/CBA/소수 희생 위험; 의무론=동기·규칙/의무/인권·강령/의무 충돌; 덕 윤리=성품/어떤 사람이 될까/문화·리더십/구체 지침 모호. p.132 펜티엄 사례의 27000년에 한 번은 자료가 제시한 일반 사용자 기준 수치이며 보편적 오류 확률로 확대하지 않는다.", "4-1": "2기둥=도덕적 인간+도덕적 관리자. p.154 개인화된 권력=사익·지위, 사회화된 권력=타인·조직 목표. p.155 위기 소통=진실성(Sincere)·신속성(Swift). p.152 4-V의 한글·영문 대응은 그대로 보되 명명 근거는 [불확실 — 확인 필요]: 다양성(Variety)·가치창출(Value creation)·투명성(Voluntariness)·시간 배분(Validity). 이를 새 객관식의 정답 근거로 사용하지 않았다.", "4-2": "Schein 3차원은 인공물→표방 가치→기본 가정 순으로 깊어진다(p.162). 공식 7종(p.167)과 비공식 5종(p.168)을 구분한다. p.168 번호 04가 반복되지만 항목은 신화와 이야기·언어를 포함해 5개다. 강한 문화≠항상 윤리적 문화.", "4-3": "기준 3개×분석 수준 3개라는 분석 틀. 실제 핵심 5유형=수단·배려·독립·규칙·법규. 독립/규칙/법규는 원칙주의의 개인/지역/광역 조합(p.187~189). p.182~183의 Benevolence를 자료는 공리주의로 표기하며, 앞 단원의 결과주의 전체와 무조건 같은 목록으로 합치지 않는다.", "5-1": "FSGO 7요소(p.201)=표준·절차→고위급 감독→교육→소통·보고→모니터링·감사→일관 징계→대응·예방. p.204 전 직원 최소 연 1회 리프레시 교육+신규 법규 수시 교육. p.198 TI는 1961년 강령·7개 질문 퀵테스트로 소개되나 질문 원문 7개는 수록되지 않아 창작하지 않았다.", "5-2": "자료 p.220의 COSO 목록은 8개다. 이 목록의 외부 프레임워크 명칭 정확성은 [불확실 — 확인 필요]이며 시험 대비는 자료 표현을 따른다. 제2선=컴플라이언스·리스크관리팀의 감독·정책·가이드(p.221). p.224 예방=강령·교육·사전평가 / 탐지=제보·감사 / 대응=조사·징계·원인분석. p.216 넓은 컴플라이언스 vs p.223 윤리와 대비한 최소 준법 관점은 문항 문맥으로 구분한다.", "5-3": "부정 원인=압력·기회·합리화(3개). 공정성=분배(결과)·절차(과정)·상호작용(대우). 심리적 안전감=의견 제기 시 불이익·비난이 없다는 믿음(p.237). p.234 모니터링은 업무 관련성·사전 고지·동의가 요구된다고 설명한다.", "6-1": "BEI는 실제 과거 행동; STAR는 그 경험을 구조화하는 답변법이다. 정직성 검사·배경 검증·평판 조회는 서로 보완한다. p.250 “인성은 가르칠 수 없다”는 채용 중요성을 강조한 자료 문구로, 교육 불가능이라는 일반 법칙으로 확대하지 않는다[추론].", "6-2": "뜨거운 난로 4원칙=사전 경고·즉각성·일관성·비인격성(p.263). p.266 결과 50%+과정 50%는 자료의 평가 설계 예시이며 보편적 의무 비율이 아니다. p.261 수율 95%도 사례의 목표 수치이다. p.258 웰스파고 하루 8개 상품 목표가 잘못된 유인 사례로 제시된다.", "6-3": "p.273 챌린저=1986년·승무원 7명. p.278 밀그램=65%·450V라는 자료 수치. p.275 애쉬의 “집단의 75%”라는 수치 문구는 실험 결과와 설정의 구분이 명확하지 않아 [불확실 — 확인 필요], 암기용 객관식에서 제외. p.285 프로젝트 아리스토텔레스=2012년부터 약 4년·180개 이상 팀, 5요인=심리적 안전감·상호 의존성·체계/명확성·의미·영향력.", "7-1": "MSDS=16항목(p.292). ISO 45001 PDCA=계획(위험평가·목표)→실행→점검(사고·아차사고)→개선(p.293). 작업 중지 4단계=Stop→Notify→Correct→Resume(p.296). PSM=12요소로 소개되나 전체 12개 목록은 없어 외부에서 보충하지 않았다(p.297). Bradley 4단계=본능적→의존적→독립적→상호의존적(p.302).", "7-2": "Triple Test 3원칙=목적 정당성·최소 침해·투명성/사전 고지(p.308). 상시 감시 대안=VDI·자율성 존중 성과관리(p.311). 보안 권한에도 견제·균형·이의제기·접근권 최소화가 필요(p.314). p.313 파일 소유·p.316 GDPR은 자료가 제시한 학습 설명이며 개별 현실 사안의 법률 판단으로 확대하지 않는다.", "7-3": "성립 요건 3개=공익성·최후 수단성·진실성(p.320). 고발자 보호와 피고발자 방어권을 함께 보장(p.328). p.324 법적 분쟁비용 평균 50% 이상 감소는 출처·표본이 제시되지 않아 [불확실 — 확인 필요]; 검증된 통계로 단정하거나 새 문항의 정답으로 사용하지 않았다. 최후 수단성·입증 책임 전환은 자료의 윤리 요건·보호 방안으로 학습하며 모든 제도의 보편 법규로 단정하지 않는다."}, "research": [["인출 연습 중심", "Roediger & Karpicke (2006), Psychological Science, 17, 249–255", "https://doi.org/10.1111/j.1467-9280.2006.01693.x", "지연 검사에서 재독보다 인출의 유지 효과가 높았다. 요약은 1회, 이후 답을 가리고 재인출한다."], ["인출·분산 우선, 재독 제한", "Dunlosky et al. (2013), Psychological Science in the Public Interest, 14, 4–58", "https://doi.org/10.1177/1529100612453266", "연습시험·분산학습의 유용성을 높게 평가한 검토에 따라 시간 대부분을 문제와 복습에 둔다."], ["간격 반복", "Cepeda et al. (2006), Psychological Bulletin, 132, 354–380", "https://doi.org/10.1037/0033-2909.132.3.354", "분산 효과는 재학습 간격과 최종 보존 기간에 좌우된다. 3→10→40시간은 사용자 지정 구현이며 이 논문의 검증된 최적 간격이 아니다."], ["정답까지 재출제·후속 재학습", "Rawson & Dunlosky (2011), Journal of Experimental Psychology: General, 140, 283–302", "https://doi.org/10.1037/a0023956", "성공 인출 기준과 후속 재학습의 중요성을 적용한다. 본 앱의 오답 3문항 뒤 재출제는 구현 선택이며 논문의 특정 처방을 그대로 복제한 것은 아니다."], ["사전 테스트", "Richland, Kornell & Kao (2009), Journal of Experimental Psychology: Applied, 15, 243–257", "https://doi.org/10.1037/a0016496", "학습 전 틀린 인출 시도도 이후 학습에 도움이 될 수 있다. 첫 20분은 미리 읽지 않고 답한 뒤 정확한 피드백을 받는다."], ["섞어풀기", "Rohrer & Taylor (2007), Instructional Science, 35, 481–498", "https://doi.org/10.1007/s11251-007-9015-8", "수학 문제에서 유형을 섞은 연습의 이점이 관찰되었다. 윤리 개념 구분에의 적용은 [추론]이며 이 과목의 효과를 직접 검증한 연구는 아니다."], ["자기 전 학습·다음 날 재학습", "Mazza et al. (2016), Psychological Science, 27, 1321–1330", "https://doi.org/10.1177/0956797616659930", "어휘 학습-수면-재학습의 이점을 토대로 취침 전 10분과 다음 날 첫 세션을 연결한다. 정확히 10분이라는 길이는 일정 설계 선택이다."], ["확신도·확신 오답 교정", "Butterfield & Metcalfe (2001), Journal of Experimental Psychology: Learning, Memory, and Cognition, 27, 1491–1494", "https://doi.org/10.1037//0278-7393.27.6.1491", "높은 확신으로 틀린 답이 피드백 뒤 잘 교정되는 현상에 근거한다. 확신 오답 우선 정렬은 이 결과를 활용한 학습 설계다."]]}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('app-data').textContent), ALL=[...D.bank,...D.ox], BY=Object.fromEntries(ALL.map(q=>[q.id,q])), KEY='semi-ethics-mobile-v1', HOUR=3600000;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFKC').toLowerCase().replace(/[\s·ㆍ\-–—.,:()（）]/g,'');
const ALIASES={'FSGO':['연방 양형 가이드라인'],'연방 양형 가이드라인':['FSGO'],'낙수 효과':['Trickle-Down Effect'],'윤리적 분위기':['Ethical Climate'],'다중 윤리 자아':['Multiple Ethical Selves'],'심리적 구획화':['Psychological Compartmentalization'],'분배적 공정성':['분배 공정성','Distributive Justice'],'모니터링':['Monitoring'],'준법 감시인':['준법감시인','Compliance Officer'],'컴플라이언스':['Compliance'],'익명성':['Anonymity'],'BEI':['Behavioral Event Interview'],'단기적 이익과 장기적 지속가능성의 갈등':['단기 대 장기','단기와 장기의 갈등','단기적 이익과 지속가능한 미래','단기적 이익과 장기적 이익의 갈등'],'Andon 시스템':['안돈 시스템'],'MSDS':['물질안전보건자료'],'의리의 역설':['Loyalty Paradox']};
function blank(){return {version:1,edition:"mobile549-v1",serial:0,records:{},mock:null};}
let state=blank(),saveFailure=false;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.version===1&&s.edition==="mobile549-v1"&&s.records)state=s;}catch(e){saveFailure=true;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saveFailure=false;}catch(e){saveFailure=true;}document.getElementById('saveStatus').textContent=saveFailure?'⚠ 저장 실패 · 백업 필요':'✓ 이 기기에 자동 저장';}
function shuffled(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function expected(q){return q.type==='short'?q.answer:q.options[q.answer];}
function matches(q,a){return q.type==='short'?[q.answer,...(ALIASES[q.answer]||[])].some(x=>norm(x)===norm(a)):Number(a)===q.answer;}
function applyResult(q,answer,conf,ok,manual=false){
 const prev=state.records[q.id]||{stage:0,attempts:0,history:[]};
 const stage=ok?Math.min(prev.stage+1,3):0;
 state.serial++;
 const now=Date.now(), hours=ok?[3,10,40][stage-1]:0;
 const event={at:now,answer,conf,ok,manual,serial:state.serial};
 state.records[q.id]={...prev,stage,attempts:prev.attempts+1,last:now,lastSerial:state.serial,lastCorrect:ok,due:now+hours*HOUR,retryAt:ok?null:state.serial+3,history:[...prev.history,event]};
 save();return {event,stage,hours};
}
let tab='practice',mode='priority',chapter='all',current=null,order=[],phase='answer',chosen=null,fixedAnswer=null,result=null,conf=null,sessionIds=[],sessionDone=new Set(),mockReview=false;
function chapterSelect(){return '<label>범위 <select id="chapter"><option value="all">전체 챕터</option>'+D.chapters.map(c=>`<option value="${c.id}" ${chapter===c.id?'selected':''}>${c.id} ${esc(c.title)}</option>`).join('')+'</select></label>';}
function root(){return document.getElementById('main');}
function showTab(t){tab=t;if(t==='practice')renderPractice();if(t==='cards')renderCards();if(t==='notes')renderNotes();if(t==='progress')renderProgress();if(t==='plan')renderPlan();}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function source(){let s=mode==='ox'?D.ox:D.bank;if(chapter!=='all')s=s.filter(q=>q.ch===chapter);if(mode==='priority')s=s.filter(q=>q.priority);if(mode==='original')s=s.filter(q=>q.id.startsWith('K'));if(mode==='pre')s=s.filter(q=>q.id.endsWith('-M01'));if(mode==='due')s=s.filter(q=>state.records[q.id]);return s;}
function begin(m){mode=m;current=null;phase='answer';sessionDone=new Set();sessionIds=shuffled(source().map(q=>q.id));pick();}
function pick(force=false){
 const now=Date.now(),s=source();
 let eligible=s.filter(q=>{const r=state.records[q.id];return r&&r.retryAt!==null&&r.retryAt!==undefined&&r.retryAt<=state.serial;});
 eligible.sort((a,b)=>{const ra=state.records[a.id],rb=state.records[b.id];const ca=ra.history.at(-1).conf==='확신'?1:0,cb=rb.history.at(-1).conf==='확신'?1:0;return cb-ca||ra.last-rb.last;});
 if(!eligible.length)eligible=s.filter(q=>{const r=state.records[q.id];return r&&(r.retryAt===null||r.retryAt===undefined)&&r.due<=now;}).sort((a,b)=>state.records[a.id].due-state.records[b.id].due);
 if(!eligible.length&&mode!=='due')eligible=sessionIds.map(id=>BY[id]).filter(q=>s.includes(q)&&!state.records[q.id]&&!sessionDone.has(q.id));

    if (d[3]) el.querySelector('.u070-act').textContent = d[3];
    var t = { el: el, left: DUR, id: ++seq, k: k };
    zone.appendChild(el);
    list.unshift(t);
    void el.offsetWidth;
    el.classList.remove('enter');
    layout();
    live.textContent = d[1];
    el.querySelector('.u070-x').addEventListener('click', function () { remove(t); });
    if (d[3]) el.querySelector('.u070-act').addEventListener('click', function () { remove(t); if (k === 'err') push('wait'); });
    // ‘저장 중’ 알림은 잠시 돌다가 완료 알림으로 바뀝니다
    if (k === 'wait') {
      t.left = Infinity;
      setTimeout(function () {
        if (!root.isConnected || list.indexOf(t) < 0) return;
        el.style.setProperty('--c', K.ok[0]);
        el.querySelector('.u070-ic').innerHTML = ICON.ok;
        el.querySelector('b').textContent = '저장을 마쳤어요';
        el.querySelector('small').textContent = '파일 3개를 모두 올렸어요';
        live.textContent = '저장을 마쳤어요';
        t.left = DUR;
      }, rm ? 300 : 1800);
    }
    // 옆으로 밀어 닫기
    var sx = 0, dx = 0, down = false;
    el.addEventListener('pointerdown', function (e) { if (e.target.closest('button')) return; down = true; sx = e.clientX; dx = 0; el.setPointerCapture(e.pointerId); el.classList.add('drag'); });
    el.addEventListener('pointermove', function (e) { if (!down) return; dx = e.clientX - sx; el.style.setProperty('--dx', dx + 'px'); el.style.setProperty('--o', Math.max(0.2, 1 - Math.abs(dx) / 260)); });
    var end = function () { if (!down) return; down = false; el.classList.remove('drag'); if (Math.abs(dx) > 90) remove(t, dx > 0 ? 1 : -1); else { el.style.setProperty('--dx', '0px'); layout(); } };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }
  // 펼쳐 둔 동안은 남은 시간이 줄지 않습니다
  var last = performance.now();
  (function loop(now) {
    if (!root.isConnected) return;
    var dt = now - last; last = now;
    if (!open) list.slice().forEach(function (t, i) {
      if (i > 0 || t.left === Infinity) return;
      t.left -= dt;
      t.el.style.setProperty('--left', Math.max(0, t.left / DUR).toFixed(3));
      if (t.left <= 0) remove(t);
    });
    requestAnimationFrame(loop);
  })(last);
  function setOpen(v) { if (open === v) return; open = v; layout(); }
  zone.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') setOpen(true); });
  zone.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && !zone.contains(document.activeElement)) setOpen(false); });
  zone.addEventListener('focusin', function () { setOpen(true); });
  zone.addEventListener('focusout', function (e) { if (!zone.contains(e.relatedTarget)) setOpen(false); });
  zone.addEventListener('click', function (e) { if (!e.target.closest('button') && list.length > 1) setOpen(!open); });
  root.querySelectorAll('.u070-btns button').forEach(function (b) { b.addEventListener('click', function () { push(b.getAttribute('data-k')); }); });
  window.toast=function(title,detail){K.ok[1]=title;K.ok[2]=detail;push('ok');};
})();
